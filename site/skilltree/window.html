<style>
:root{
  --bg:#050a13; --panel:#0a1422cc; --holo:#62e4ff; --holo2:#3aa9d6; --gold:#d9b66c;
  --text:#d8ecf6; --dim:#7f9bb0; --var:#e9a7ff; --warn:#ffae57;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--text)}
#stage{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0}
#win{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 54%,#0d2338 0%,#07111d 46%,#04080f 100%)}
#win::before{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(30deg,#62e4ff22 1px,transparent 1px),linear-gradient(150deg,#62e4ff22 1px,transparent 1px);background-size:34px 20px}
#win::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
svg{position:absolute;inset:0;overflow:visible}
.panel{position:absolute;background:var(--panel);border:1px solid #2b5571;box-shadow:inset 0 0 24px #62e4ff14,0 0 18px #0009}
.panel::before,.panel::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--gold)}
.panel::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
.panel::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
header{position:absolute;left:24px;right:24px;top:18px;height:58px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #2b5571;z-index:5}
header .title{font-size:13px;letter-spacing:.32em;color:var(--gold);white-space:nowrap}
header .title b{display:block;font-size:22px;letter-spacing:.08em;color:var(--text)}
.tabs{display:flex;gap:6px;margin-left:24px;position:relative}
.tab{font-size:14px;padding:7px 16px;border:1px solid #2b5571;color:var(--dim);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);background:#0b1828;cursor:pointer;white-space:nowrap}
.tab.on{color:#03121c;background:linear-gradient(90deg,var(--holo),#b9f4ff);border-color:var(--holo);font-weight:700}
.tab.sub{margin-left:14px}
#menu{position:absolute;left:0;top:44px;display:none;grid-template-columns:repeat(6,96px);gap:6px;padding:12px;background:#07111dee;border:1px solid #2b5571;box-shadow:0 10px 30px #000a}
#menu.open{display:grid}
#menu button{font-size:13.5px;padding:7px 0;text-align:center;border:1px solid #2b5571;cursor:pointer;color:var(--text)}
#menu button.on{border-color:var(--holo);color:var(--holo)}
.close{margin-left:auto;font-size:12px;color:var(--dim);letter-spacing:.2em}
#left{left:24px;top:96px;width:300px;height:880px;padding:20px 22px}
#right{left:1256px;top:96px;width:320px;height:880px;padding:22px;overflow:hidden}
.k{font-size:11px;letter-spacing:.26em;color:var(--gold);margin:15px 0 7px}
.k:first-child{margin-top:0}
.emb{display:flex;align-items:center;gap:14px}
.emb h1{margin:0;font-size:30px;letter-spacing:.06em}
.emb small{display:block;color:var(--dim);font-size:13px;margin-top:3px}
p{margin:0;font-size:13.5px;line-height:1.6;color:#bcd3e0}
.row{display:flex;align-items:center;gap:9px;font-size:13.5px;margin:5px 0}
.sw{width:12px;height:12px;transform:rotate(45deg);flex:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.ln{width:34px;height:0;border-top:2px solid;flex:none}
.cnt{margin-left:auto;color:var(--dim);font-family:Consolas,monospace}
.box{border:1px solid #6b4b23;background:#2a1a0a66;padding:9px 12px;font-size:12.5px;line-height:1.55;color:#f3d3a8;margin-top:10px}
.acq{border:1px solid var(--gold);background:linear-gradient(90deg,#3a2a0c88,#0a142288);padding:9px 12px;font-size:13px;line-height:1.55;color:#ffe2a8}
.acq b{display:block;font-size:11px;letter-spacing:.24em;color:var(--gold);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;padding:3px 8px;border:1px solid #2b5571;color:#bcd3e0;background:#0b1828}
#right h2{margin:2px 0 4px;font-size:26px}
.code{font-family:Consolas,monospace;color:var(--holo);font-size:13px;letter-spacing:.12em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tag{font-size:12px;padding:3px 8px;border:1px solid;border-radius:2px}
.rel{font-size:13px;line-height:1.5;margin:4px 0;color:#bcd3e0}
.rel i{font-style:normal;font-family:Consolas,monospace;font-size:11px;margin-right:6px}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.bd span{font-size:12px;padding:3px 6px;border:1px solid #2b5571;text-align:center}.g0{color:#8fe3b0}.g1{color:#bcd3e0}.g2{color:#ffb46b;border-color:#6b4b23!important}.g3{color:#ff7b7b;border-color:#6b2323!important}
#right{overflow-y:auto!important}
#bar{position:absolute;left:344px;width:896px;top:944px;height:32px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.tg{border:1px solid #2b5571;padding:5px 10px;cursor:pointer;color:var(--dim);background:#0b1828;font:inherit}
.tg.on{color:var(--text);border-color:var(--holo2);box-shadow:inset 0 0 10px #62e4ff33}
#bar .note{margin-left:auto;color:#9fb6c6}
.node{cursor:pointer}
.lbl{font-size:14px;font-weight:700;fill:var(--text);paint-order:stroke;stroke:#050a13;stroke-width:5px;text-anchor:middle}
.vl{font-size:12px;fill:#f0d4fb;paint-order:stroke;stroke:#050a13;stroke-width:4px;text-anchor:middle}
.sect{font-size:13px;letter-spacing:.42em}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:800px 540px;animation:spin 240s linear infinite}
.spinr{transform-origin:800px 540px;animation:spin 180s linear infinite reverse}
#left {overflow:auto}
.crest {width:72px;height:72px;flex:none}
.illustration {display:block;margin:14px 0}
.illustration img {display:block;width:100%;height:auto}
.detail-icon {float:right;width:78px;height:78px;margin:0 0 8px 10px}
.tags {clear:both}
.node:focus-visible {outline:2px solid #fff;outline-offset:3px}
.rel button {color:inherit;background:none;border:0;border-bottom:1px dotted currentColor;cursor:pointer;font:inherit}
#narrow-controls {display:none}
#tree {pointer-events:none}
#tree .node {pointer-events:auto}
@media(max-width:1100px){
 html,body {height:auto;overflow:auto}
 #stage,#win {position:relative;width:100%;height:auto;transform:none!important}
 #win {display:flex;flex-direction:column;padding:12px;gap:10px}
 #win::before,#win::after,#bg,header,#bar .note {display:none}
 #narrow-controls {display:flex;gap:8px;flex-wrap:wrap;order:0}
 #narrow-controls label {display:grid;gap:4px;flex:1;min-width:115px;font-size:13px}
 #narrow-controls select {width:100%;font:inherit;color:var(--text);background:#122539;border:1px solid #50748c;padding:8px}
 #left,#right,#bar,#tree {position:relative;inset:auto;width:100%;height:auto}
 #left,#right {padding:16px;overflow:visible!important}
 #left {order:4} #right {order:2} #bar {order:3;flex-wrap:wrap} #tree {order:1;aspect-ratio:1/1;overflow:hidden}
 #right h2 {font-size:22px}
 .detail-icon {width:64px;height:64px}
 .illustration {max-width:560px}
}
@media(prefers-reduced-motion:reduce){.spin,.spinr{animation:none}}
</style>

  el('path',{d:'M0-11L11 0 0 11-11 0Z',fill:'#0b1828',stroke:c,'stroke-width':2,filter:'url(#glow)'},g);
  el('text',{class:'vl',y:26},g).textContent=`${x.other} · ${x.oname} ↗`;
  // 화면의 다른 글자·노드와 겹치지 않는 첫 자리(바깥 고리에서 각도를 조금씩 비튼다)
  const others=[...document.querySelectorAll('svg text, .node image, .node path')].filter(t=>!g.contains(t)).map(t=>t.getBoundingClientRect()).filter(o=>o.width<300);   // 고리 둘레 글자(textPath)는 화면 전체를 덮어 제외
  const hit=(r,o)=>r.left<o.right+4&&o.left<r.right+4&&r.top<o.bottom+4&&o.top<r.bottom+4;
  const P=[0,.15,-.15,.3,-.3,.45,-.45,.6,-.6,.8,-.8].flatMap(da=>[455,430,480,405].map(r=>at(da,r))).find(p=>{
   g.setAttribute('transform',`translate(${p.x} ${p.y})`);const r=g.getBoundingClientRect();return !others.some(o=>hit(r,o))})||at(0,455);
  g.setAttribute('transform',`translate(${P.x} ${P.y})`);
  const [a,b]=trim(A,P,rad(A)+4,12),[p,q]=x.dir==='out'?[a,b]:[b,a];
  el('path',{d:`M${p.x} ${p.y}L${q.x} ${q.y}`,stroke:c,'stroke-width':x.a===sel?3:2,'stroke-dasharray':'10 4 2 4',fill:'none','marker-end':'url(#mCROSS)'},ge);
 });
}
function legendRows(){
 if(D.mode==='special'){
  const cnt=g=>D.nodes.filter(n=>n.group===g).length;
  return `<div class="k">갈래</div>${D.groups.map((g,i)=>`<div class="row"><span class="sw" style="background:${PAL[i]};box-shadow:0 0 8px ${PAL[i]}"></span>${g}<span class="cnt">${cnt(g)}</span></div>`).join('')}
  <div class="row"><span class="sw" style="background:var(--var)"></span>변형<span class="cnt">${cnt('변형')}</span></div>
  <div class="k">근거</div>${['원자료 기반','신규 설계','기존 정의(3-B)','21기법 확장'].map(t=>`<div class="row"><span class="dot" style="background:${BC[t]}"></span>${t}</div>`).join('')}
  ${D.nodes.some(n=>n.pending)?'<div class="row"><span class="dot" style="background:#2a1606;border:1.5px solid var(--warn)"></span>미결 안건 있음</div>':''}
  <div class="k">관계선</div>${Object.entries(TY).filter(([k])=>D.edges.some(e=>e.t===k)).map(([k,[t,c]])=>`<div class="row"><span class="ln" style="border-color:${c};border-top-style:${k==='RECOMMENDED_LEARNING'?'solid':'dashed'}"></span>${t}<span class="cnt">${D.edges.filter(e=>e.t===k).length}</span></div>`).join('')}`;
 }
 const cnt=g=>D.nodes.filter(n=>n.group===g).length,tier=t=>D.nodes.filter(n=>n.tier===t).length;
 return `<div class="k">분기</div>${D.groups.map((g,i)=>`<div class="row"><span class="sw" style="background:${PAL[i]};box-shadow:0 0 8px ${PAL[i]}"></span>${g}<span class="cnt">${cnt(g)}</span></div>`).join('')}
  <div class="k">위계 고리</div><div class="row">안쪽 기초 ${tier('기초')} · 중급 ${tier('중급')} · 바깥 고등 ${tier('고등')} · 최고위 ${tier('최고위')}</div>
  <div class="row"><span class="dot" style="border:1.5px solid #d9b66c"></span>금색 테두리 = 최고위</div>
  <div class="k">출처</div>${['3-B 승계','구판 재채택','신규(확장안)'].map(t=>`<div class="row"><span class="dot" style="background:${BC[t]}"></span>${t}<span class="cnt">${D.nodes.filter(n=>n.basis===t).length}</span></div>`).join('')}
  <div class="k">관계선</div>${Object.entries(TY).filter(([k])=>D.edges.some(e=>e.t===k)).map(([k,[t,c]])=>`<div class="row"><span class="ln" style="border-color:${c};border-top-style:${k==='RECOMMENDED_LEARNING'?'solid':'dashed'}"></span>${t}<span class="cnt">${D.edges.filter(e=>e.t===k).length}</span></div>`).join('')}
  ${D.cross.length?`<div class="row"><span class="ln" style="border-color:${TY.CROSS[1]};border-top-style:dashed"></span>계열 간 (◇ 누르면 이동)<span class="cnt">${D.cross.length}</span></div>`:''}
  <p style="color:var(--dim);margin-top:6px">권장 학습은 교육 경로 예시이며 필수 선행이 아니다. 계열 간 관계는 XR02·XR06만 선으로 표시하고, 나머지 6건은 정본 계열 문서에 적는다(2026-11-10).</p>`;
}
function drawLeft(){
 document.getElementById('left').innerHTML=`
 <div class="emb"><img class="crest" src="${D.nodes[0].icon}" alt="">
 <div><h1 style="${D.name.length>4?'font-size:23px':''}">${D.name}</h1><small>${esc(D.kind)}</small>${D.creator?`<small>창시자 · ${D.creator}</small>`:''}</div></div>
 <div class="k">${D.mode==='special'?'본질':'개요'}</div><p>${esc(D.essence)}</p>
 <div class="k">계열 습득</div><div class="acq" style="">${esc(D.acquire)}</div>
 <a class="illustration" href="${D.artFull}" target="_blank" rel="noopener"><img src="${D.art}" alt="${D.name} 계열 대표 삽화 · 확대"></a>
 ${legendRows()}
 ${D.box?`<div class="box">${esc(D.box)}</div>`:''}${D.outside?`<div class="box" style="border-color:#2b5571;background:#0b1828;color:#9fb6c6">이관·통합 · ${esc(D.outside)}</div>`:''}`;
}
function drawRight(){
 const n=by[sel],c=col(n);
 if(n.core){
  const cnt=D.nodes.filter(x=>!x.core&&x.code!=='V').length;
  document.getElementById('right').innerHTML=`<div class="code">DISCIPLINE · ${esc(D.kind)}</div><h2 style="color:${c};text-shadow:0 0 14px ${c}88">${D.name}</h2>
  <div class="k">${D.mode==='special'?'본질':'개요'}</div><p>${esc(D.essence)}</p>
  <div class="k">수록 기법</div><p>${cnt}개${D.mode==='general'?' · 3-B 승계 '+D.nodes.filter(x=>x.basis==='3-B 승계').length+'개 · 확장안 2026-11-08 채택':''}</p>
  <div class="k">계열 습득</div><p>${esc(D.acquire)}</p>`;
  return;
 }
 const rel=D.edges.filter(e=>(e.a===sel||e.b===sel)&&e.t!=='MEMBER').map(e=>{const o=by[e.a===sel?e.b:e.a],[t,cc]=TY[e.t];return `<div class="rel"><i style="color:${cc}">${t}</i>${e.a===sel?'→':'←'} <button type="button" data-node="${o.id}">${esc(o.name)}</button></div>`}).join('');
 const xr=(D.cross||[]).filter(x=>x.a===sel).map(x=>`<div class="rel"><i style="color:${TY.CROSS[1]}">계열 간 · ${esc(x.label)}</i>${x.dir==='out'?'→':'←'} <button type="button" data-cross="${x.id}">${esc(x.other)} · ${esc(x.oname)}</button></div>`).join('');
 const gen=D.mode==='general';
 document.getElementById('right').innerHTML=`
 <div class="code">${n.code==='V'?'VARIANT':(gen?D.name+' '+n.code:n.code)} · ${esc(n.group)}</div>
 <h2 style="color:${c};text-shadow:0 0 14px ${c}88">${esc(n.name)}</h2>
 <div class="tags">${BC[n.basis]?`<span class="tag" style="color:${BC[n.basis]};border-color:${BC[n.basis]}">${esc(n.basis)}</span>`:`<span class="tag" style="color:${c};border-color:${c}">${esc(n.group)}</span>`}${n.id===D.nodes[0].id&&!n.core?'<span class="tag" style="color:var(--gold);border-color:var(--gold)">핵심 기법</span>':''}${n.tier?`<span class="tag" style="color:#bcd3e0;border-color:#2b5571">${n.tier} · ${n.op}</span>`:''}</div>
 <div class="k">${gen?'설명':'효과 범위'}</div><p>${esc(n.effect)}</p>
 ${n.b3?`<div class="k">3-B 근거</div><p>${esc(n.b3)}</p>`:''}
 ${gen&&!n.b3&&n.ring!==3?`<div class="k">근거</div><p>2026-11-08 채택된 확장안의 신규 기법. 3-B 원문 서술은 없다.</p>`:''}
 ${n.legacy?`<div class="k">구판 원형</div><p style="color:var(--dim)">${esc(n.legacy)}</p>`:''}
 ${n.decision?`<div class="box" style="border-color:#2b5571;background:#0b1828;color:#bfe9ff">결정 2026-11-08 · ${esc(n.decision)}</div>`:''}
 ${n.use?`<div class="k">${n.ring===3?'보존되는 핵심':'사용 조건'}</div><p>${esc(n.use)}</p>`:''}
 ${n.ready?`<div class="k">학습 준비 역량</div><p>${esc(n.ready)}</p>`:''}
 <div class="k">관계</div>${rel+xr||'<div class="rel">연결된 관계 없음 — 독립 습득 기법</div>'}
 ${n.vuse?`<div class="k">사용 조건</div><p>${esc(n.vuse)}</p>`:''}
 ${n.principle?`<div class="k">작동원리</div><p>${esc(n.principle)}</p>`:''}
 ${n.effects&&n.effects!==n.effect?`<div class="k">주요 효과</div><p>${esc(n.effects)}</p>`:''}
 ${n.acq_t?`<div class="k">습득(기법)</div><p>${esc(n.acq_t)}</p>`:''}
 ${n.maint?`<div class="k">유지</div><p>${esc(n.maint)}</p>`:''}
 ${n.burden?`<div class="k">운용 부담</div><div class="bd">${Object.entries(n.burden).map(([ax,o])=>`<span class="g${['낮음','보통','높음','극심'].indexOf(o.grade)}" title="${esc(o.reason)}">${ax} ${o.grade}</span>`).join('')}</div>`:''}
 ${n.pending?`<div class="box">${esc(n.pending)}</div>`:''}
 <div class="k">습득 조건</div><p style="color:var(--dim)">${gen?esc(D.acquire)+'<br>기법 간: 필수 선행 없음 · 권장 순서만 존재':'계열: 창시자 '+D.creator+' 직접 전수 필수<br>기법 간: 필수 선행 없음 · 권장 순서만 존재'}</p>`;
}
function drawBar(){
 const b=document.getElementById('bar');b.innerHTML='표시';
 Object.entries(TY).filter(([k])=>D.edges.some(e=>e.t===k)).forEach(([k,[t]])=>{const x=document.createElement('button');x.className='tg'+(show[k]?' on':'');x.textContent=t;x.onclick=()=>{show[k]=!show[k];render()};b.append(x)});
 const n=document.createElement('span');n.className='note';
 n.textContent=D.mode==='special'?`계열 습득은 창시자 ${D.creator} 직접 전수 · 실선은 권장 학습 순서(필수 아님)`:'부채꼴 = 분기 · 안쪽→바깥 = 기초→고등·최고위 · 위계는 학습 순서가 아님';b.append(n);
}
function drawTabs(){
 const gen=ALL.filter(d=>d.mode==='general'),cur=D.mode==='general';
 const t=document.getElementById('tabs');
 t.innerHTML=ALL.filter(d=>d.mode==='special').map(d=>`<button type="button" class="tab${d.name===D.name?' on':''}" data-d="${d.name}">${d.name}</button>`).join('')+
  `<button type="button" class="tab sub${cur?' on':''}" id="gtab">${cur?'일반 · '+D.name:'일반 18계열'} ▾</button><div id="menu">${gen.map(d=>`<button type="button" class="${d.name===D.name?'on':''}" data-d="${d.name}">${d.name}</button>`).join('')}</div>`;
 t.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>open_(x.dataset.d));
 document.getElementById('gtab').onclick=()=>document.getElementById('menu').classList.toggle('open');
}
function selectNode(id, remember=true){
 if(!by[id])return;
 sel=id;
 if(remember)saveLocation();
 render();
}
function saveLocation(){
 const url=new URL(location.href);
 if(url.searchParams.get('d')===D.name && url.searchParams.get('sel')===sel)return;
 url.searchParams.set('d',D.name);url.searchParams.set('sel',sel);
 history.pushState(null,'',url);
}
function bindControl(g,label,activate){
 g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',label);
 g.onclick=activate;
 g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();const next=document.querySelector('#tree [data-uid="'+by[sel].uid+'"]');next?.focus({preventScroll:true});}};
}
function followCross(x){const dest=ALL.find(d=>d.name===x.other);open_(x.other,dest.nodes.find(n=>n.name===x.oname).id,true);}
function render(){
 drawTree();drawRight();drawBar();
 const detail=document.getElementById('right');
 const icon=document.createElement('img');icon.className='detail-icon';icon.alt='';icon.src=by[sel].icon;detail.prepend(icon);
 detail.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>selectNode(b.dataset.node));
 detail.querySelectorAll('[data-cross]').forEach(b=>b.onclick=()=>followCross(D.cross.find(x=>x.id===b.dataset.cross)));
 document.getElementById('node-picker').value=sel;
}
function open_(name,id,remember=true){
 load(name);sel=by[id]?id:D.sel;
 const picker=document.getElementById('discipline-picker');picker.value=D.name;
 document.getElementById('node-picker').replaceChildren(...D.nodes.map(n=>new Option(n.name,n.id)));
 if(remember)saveLocation();
 drawBg();drawTabs();drawLeft();render();
}
function fit(){
 const narrow=matchMedia('(max-width:1100px)').matches;
 document.getElementById('tree').setAttribute('viewBox',narrow?'315 55 970 970':'0 0 1600 1000');
 const s=Math.min(innerWidth/1600,innerHeight/1000);
 document.getElementById('stage').style.transform='translate('+((innerWidth-1600*s)/2)+'px,'+((innerHeight-1000*s)/2)+'px) scale('+s+')';
}
const picker=document.getElementById('discipline-picker');
picker.replaceChildren(...ALL.map(d=>new Option(d.name,d.name)));picker.onchange=()=>open_(picker.value);
document.getElementById('node-picker').onchange=e=>selectNode(e.target.value);
function restore(){const q=new URLSearchParams(location.search);open_(q.get('d')||'환영검',q.get('sel'),false);}
addEventListener('popstate',restore);addEventListener('resize',fit);fit();restore();
</script>
</body>
</html>
